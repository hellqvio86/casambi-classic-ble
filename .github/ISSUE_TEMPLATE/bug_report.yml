name: Bug Report
description: Report an issue or unexpected behavior with Casambi Classic devices
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for reporting an issue!
        
        **Important Notes:**
        - **Classic vs. Evolution:** This library is dedicated **exclusively to Casambi Classic firmware**. If your network runs the **Evolution** profile, please report to upstream [`casambi-bt`](https://github.com/lkempf/casambi-bt).
        - **Zero PII & Secret Safety:** **NEVER include network passwords, encryption keys, or real Bluetooth MAC addresses.** Standardize or mask addresses (e.g. `AA:BB:CC:DD:EE:FF`).

  - type: dropdown
    id: firmware_profile
    attributes:
      label: Casambi Network Firmware Profile
      description: Check via Casambi App -> More (...) -> Network setup -> Network configuration -> Radio profile.
      options:
        - "Classic (Supported)"
        - "Evolution (Unsupported - Use lkempf/casambi-bt)"
        - "Unknown / Not Sure"
    validations:
      required: true

  - type: input
    id: firmware_version
    attributes:
      label: Firmware Version
      description: e.g., 26.15, 25.0, etc.
      placeholder: "26.15"
    validations:
      required: false

  - type: input
    id: hardware_model
    attributes:
      label: Hardware / Fixture Model
      description: e.g., Vadsbo LD220WCM, Vadsbo LD220WCM_onoff, Casambi CBU-PWM4 RGBW, AIMOTION GLOW.
      placeholder: "Vadsbo LD220WCM"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: OS, Python & Library Version
      description: e.g., Ubuntu 24.04 (Linux 6.8), Python 3.12.3, casambi-classic-ble 0.3.0
      placeholder: "Linux x86_64, Python 3.12.3, casambi-classic-ble 0.3.0"
    validations:
      required: true

  - type: input
    id: bluez_adapter
    attributes:
      label: Bluetooth Adapter & BlueZ Version
      description: Output of `bluetoothctl -v` and controller model (e.g. BlueZ 5.66, Intel AX210 USB)
      placeholder: "BlueZ 5.66, Raspberry Pi 4 onboard Bluetooth"
    validations:
      required: false

  - type: dropdown
    id: integration_context
    attributes:
      label: Usage Context
      options:
        - "Home Assistant (casambi-classic-bt-hass integration)"
        - "Direct Python Script / Custom Automation"
        - "CLI / Testing Suite"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of the issue.
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can the issue be reproduced?
      placeholder: |
        1. Initialize CasambiDevice(address="AA:BB:CC:DD:EE:FF")
        2. Call await device.connect()
        3. Call await device.set_level(unit_id=1, level=0.5)
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Debug Logs & Traceback
      description: |
        Please paste relevant logs with timestamps.
        CRITICAL: Redact all real Bluetooth MAC addresses, encryption keys, and network passwords before submitting!
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have verified my Casambi network is running the **Classic** radio profile.
          required: true
        - label: I have sanitized all logs to ensure **NO real MAC addresses, passwords, or network keys** are exposed.
          required: true
        - label: I searched existing GitHub issues and confirmed this has not been reported.
          required: true
