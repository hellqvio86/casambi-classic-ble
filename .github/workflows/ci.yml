name: CI/CD

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      job:
        description: 'Select which job to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - lint
          - test
          - security
          - draft-release
          - publish

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'lint' ||
      inputs.job == 'publish'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run ruff check
        run: uv run ruff check src/

      - name: Run ruff format check
        run: uv run ruff format --check src/

      - name: Run mypy type check
        run: uv run mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'test' ||
      inputs.job == 'publish'
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            resolution: "highest"
          - python-version: "3.13"
            resolution: "highest"
          - python-version: "3.12"
            resolution: "lowest-direct"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (${{ matrix.resolution }})
        run: |
          if [ "${{ matrix.resolution }}" = "lowest-direct" ]; then
            uv sync --resolution lowest-direct --all-extras
          else
            uv sync --locked --all-extras
          fi

      - name: Run tests
        run: |
          uv run pytest src/tests/ --cov=casambi_classic_ble --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python-version == '3.12' && matrix.resolution == 'highest'
        with:
          name: coverage-report
          path: coverage.xml

  secrets:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'security' ||
      inputs.job == 'publish'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7

  trivy:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'security' ||
      inputs.job == 'publish'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

  audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.job == 'all' ||
      inputs.job == 'security' ||
      inputs.job == 'publish'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Run pip-audit
        run: uvx pip-audit

  all-checks:
    name: All Checks Passed
    if: always()
    timeout-minutes: 15
    needs: [lint, test, secrets, trivy, audit]
    outputs:
      success: ${{ steps.check.outputs.success }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs
        id: check
        run: |
          LINT_RESULT="${{ needs.lint.result }}"
          TEST_RESULT="${{ needs.test.result }}"
          SECRETS_RESULT="${{ needs.secrets.result }}"
          TRIVY_RESULT="${{ needs.trivy.result }}"
          AUDIT_RESULT="${{ needs.audit.result }}"
          if [[ "$LINT_RESULT" == "success" || "$LINT_RESULT" == "skipped" ]] && \
             [[ "$TEST_RESULT" == "success" || "$TEST_RESULT" == "skipped" ]] && \
             [[ "$SECRETS_RESULT" == "success" || "$SECRETS_RESULT" == "skipped" ]] && \
             [[ "$TRIVY_RESULT" == "success" || "$TRIVY_RESULT" == "skipped" ]] && \
             [[ "$AUDIT_RESULT" == "success" || "$AUDIT_RESULT" == "skipped" ]]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "All executed checks passed!"
          else
            echo "success=false" >> $GITHUB_OUTPUT
            echo "One or more checks failed"
            exit 1
          fi

  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [all-checks]
    if: |
      always() &&
      needs.all-checks.outputs.success == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'draft-release'))
      )
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version change
        id: check_version
        shell: bash
        run: |
          CURRENT_VERSION=$(grep -m 1 '^version =' pyproject.toml | cut -d '"' -f 2)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Error: Could not extract current version from pyproject.toml"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.job }}" = "draft-release" ]; then
            echo "Manual draft-release dispatch for version $CURRENT_VERSION"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          BEFORE_SHA="${{ github.event.before }}"
          BASE_REF=""
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "$BEFORE_SHA" >/dev/null 2>&1; then
            BASE_REF="$BEFORE_SHA"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            BASE_REF="HEAD~1"
          fi

          if [ -n "$BASE_REF" ]; then
            PREVIOUS_VERSION=$(git show "$BASE_REF:pyproject.toml" 2>/dev/null | grep -m 1 '^version =' | cut -d '"' -f 2 || echo "")
            if [ -z "$PREVIOUS_VERSION" ]; then
              echo "Error: Could not read pyproject.toml from base ref $BASE_REF"
              exit 1
            fi
            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "Version bump detected: $PREVIOUS_VERSION -> $CURRENT_VERSION"
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            else
              echo "Version unchanged ($CURRENT_VERSION)"
              echo "changed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No previous commit found (initial commit). Tagging initial version $CURRENT_VERSION if not exists."
            if git rev-parse "v$CURRENT_VERSION" >/dev/null 2>&1; then
              echo "Tag v$CURRENT_VERSION already exists"
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create Git tag
        if: steps.check_version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${{ steps.check_version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.check_version.outputs.version }} already exists"
          else
            git tag -a "v${{ steps.check_version.outputs.version }}" -m "Release v${{ steps.check_version.outputs.version }}"
            git push origin "v${{ steps.check_version.outputs.version }}"
          fi

      - name: Install uv
        if: steps.check_version.outputs.changed == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.check_version.outputs.changed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build package
        if: steps.check_version.outputs.changed == 'true'
        run: |
          uv build

      - name: Generate SBOM
        if: steps.check_version.outputs.changed == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Generate Changelog
        if: steps.check_version.outputs.changed == 'true'
        shell: bash
        run: |
          git fetch --tags --force
          TAGS=$(git tag --sort=-v:refname | grep -E '^v[0-9]')
          TAG_COUNT=$(echo "$TAGS" | grep -c -E '^v[0-9]' || true)
          echo "## Changelog" > changelog.md
          echo "" >> changelog.md
          if [ "$TAG_COUNT" -le 1 ]; then
            git log --pretty=format:"* %s (%h)" --no-merges >> changelog.md
          else
            PREV_TAG=$(echo "$TAGS" | sed -n '2p')
            git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges >> changelog.md
          fi
          echo "" >> changelog.md

      - name: Create Release Draft
        if: steps.check_version.outputs.changed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.check_version.outputs.version }}
          name: v${{ steps.check_version.outputs.version }}
          draft: true
          body_path: changelog.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            sbom.spdx.json
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    needs: [all-checks]
    environment:
      name: pypi
      url: https://pypi.org/p/casambi-classic-ble
    if: |
      always() &&
      needs.all-checks.outputs.success == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (
        (github.event_name == 'release' && github.event.action == 'published') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'publish')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release tag matches pyproject version
        if: github.event_name == 'release'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep -m 1 '^version =' pyproject.toml | cut -d '"' -f 2)
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Error: Release tag version ($TAG_VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi
          echo "Verified release tag version ($TAG_VERSION) matches pyproject.toml ($PYPROJECT_VERSION)"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  sbom:
    name: Generate and Upload SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [all-checks]
    if: |
      always() &&
      needs.all-checks.outputs.success == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'publish' || inputs.job == 'draft-release'))
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
