[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casambi-classic-ble"
version = "0.3.2"
description = "Bluetooth Low Energy library for Casambi classic firmware lighting control (fork of casambi-bt by Lukas Kempf)"
authors = [
    {name = "Lukas Kempf (Original casambi-bt author)"},
    {name = "Olof Hellqvist (casambi-classic-ble maintainer)", email = "olof.hellqvist@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["casambi", "bluetooth", "ble", "smart-lighting", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "bleak>=0.21.0",
    "aiohttp>=3.14.4",
    "multidict>=6.7.2",
    "websockets>=12.0",
    "cryptography>=40.0.0",
    "httpx>=0.25",
    "bleak_retry_connector>=4.6.0",
    "anyio>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/hellqvio86/casambi-classic-ble"
Repository = "https://github.com/hellqvio86/casambi-classic-ble"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["casambi_classic_ble*"]
exclude = ["tests*", "examples*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --cov=casambi_classic_ble --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
