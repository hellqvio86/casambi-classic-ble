version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "hellqvio86"
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "hellqvio86"
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
