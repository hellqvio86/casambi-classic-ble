[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casambi-classic-ble"
version = "0.1.0"
description = "Bluetooth Low Energy library for Casambi classic firmware lighting control"
authors = [
    {name = "Olof Hellqvist", email = "olof.hellqvist@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = ["casambi", "bluetooth", "ble", "smart-lighting", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "bleak>=0.21.0",
    "aiohttp>=3.14.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/hellqvio86/casambi-classic-ble"
Repository = "https://github.com/hellqvio86/casambi-classic-ble"

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
