[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casambi-classic-ble"
version = "0.5.1"
description = "Bluetooth Low Energy library for Casambi classic firmware lighting control (fork of casambi-bt by Lukas Kempf)"
authors = [
    {name = "Lukas Kempf (Original casambi-bt author)"},
    {name = "Olof Hellqvist (casambi-classic-ble maintainer)", email = "olof.hellqvist@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["casambi", "bluetooth", "ble", "smart-lighting", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "bleak>=0.21.0",
    "aiohttp>=3.14.4",
    "websockets>=13.0",
    "cryptography>=40.0.0",
    "httpx>=0.25",
    "bleak_retry_connector>=4.6.0",
    "anyio>=4.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/hellqvio86/casambi-classic-ble"
Repository = "https://github.com/hellqvio86/casambi-classic-ble"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["casambi_classic_ble*"]
exclude = ["tests*", "examples*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "BLE", "RUF", "SIM"]
ignore = [
    "E501",
    "RUF012",
    "RUF022",
    "RUF001",
    "RUF002",
    "RUF003",
    "B008",
    "B905",
    "B904",
    "SIM105",
    "SIM108",
    "SIM113",
    "SIM114",
    "SIM102",
    "ASYNC109",
    "BLE001",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # pytest-cov emits this when conftest imports the package before coverage collector starts
    "ignore::coverage.exceptions.CoverageWarning",
    # Allow running the test suite under PYTHONOPTIMIZE=1 (python -O) per S-004 / A-006
    "ignore:assertions not in test modules or plugins:pytest.PytestConfigWarning",
    # anyio thread runner GC unraisable warning on older matrix versions
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
addopts = "-v --tb=short --cov=casambi_classic_ble --cov-branch --cov-fail-under=80 --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
]
